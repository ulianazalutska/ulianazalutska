name: Update contribution heatmap

on:
  schedule:
    - cron: "17 3 * * *"   # раз на день, 03:17 UTC
  workflow_dispatch: {}     # можливість запустити вручну з вкладки Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py ulianazalutska

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update contribution heatmap"
          git push
